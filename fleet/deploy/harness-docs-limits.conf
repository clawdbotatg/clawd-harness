# nginx http context: /etc/nginx/conf.d/harness-docs-limits.conf
limit_req_zone $binary_remote_addr zone=fleet_docs_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=fleet_docs_connections:1m;
limit_req_zone $server_name zone=fleet_docs_total_requests:1m rate=20r/s;
limit_conn_zone $server_name zone=fleet_docs_total_connections:1m;
