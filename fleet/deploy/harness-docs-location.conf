# Include in h.atg.link's HTTPS server block only.
location ^~ /docs/ {
    limit_req zone=fleet_docs_requests burst=20 nodelay;
    limit_req zone=fleet_docs_total_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn fleet_docs_connections 8;
    limit_conn fleet_docs_total_connections 32;
    limit_conn_status 429;
    client_max_body_size 4m;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
    proxy_set_header Upgrade "";
    # Keep credentials out of access logs, including rejected requests.
    access_log /var/log/nginx/h.atg.link.access.log noquery;
}
